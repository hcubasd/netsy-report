name: Publication release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate tag and publication opt-in
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/project.py release "$RELEASE_TAG"
  check:
    needs: policy
    uses: ./.github/workflows/build.yml
  release:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: checked-document
          path: dist/
      - name: Package source and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/project.py package "$RELEASE_TAG"
      - name: Publish checked assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag --title "$RELEASE_TAG" \
            --notes "Checked manuscript, source archive, build provenance and SHA-256 checksums."
